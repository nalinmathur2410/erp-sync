<h2>Products</h2>
<form (ngSubmit)="addProduct()">
  <input [(ngModel)]="newProduct.name" name="name" placeholder="Name" required>
  <input [(ngModel)]="newProduct.price" name="price" placeholder="Price" type="number" required>
  <button type="submit">Add Product</button>
</form>

@if (!syncService.online) {
  <p style="color:red">Offline: changes will sync automatically</p>
}

<ul>
  @for (p of products; track p) {
    <li>{{ p.id }} - {{ p.name }} - {{ p.price }}</li>
  }
</ul>
